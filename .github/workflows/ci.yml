name: THRESHOLD verification
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'evidence/**'
      - 'README.md'
      - 'DELIVERY_MANIFEST.json'
      - 'V03_DELIVERY_MANIFEST.json'
      - 'ATELIER_DELIVERY_MANIFEST.json'
  pull_request:
concurrency:
  group: threshold-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # The full SwiftShader run now includes high-resolution material/portal checks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify 2>&1 | tee evidence/ci-verify.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-evidence
          path: |
            evidence/
            playwright-report/
            test-results/
            dist/
