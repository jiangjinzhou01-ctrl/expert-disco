name: THRESHOLD V0.2 verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify 2>&1 | tee evidence/ci-verify.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threshold-v02-evidence
          path: |
            evidence/
            playwright-report/
            test-results/
            dist/
